<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="0.55" stop-color="#050811"/>
      <stop offset="1" stop-color="#010205"/>
    </linearGradient>
    <radialGradient id="gSky" cx="0.2" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#gSky)"/>
  <rect width="1024" height="1024" fill="url(#gViolet)"/>

  <!-- four streaks climbing: work, career, family, health -->
  <g stroke-linecap="round" stroke-width="104">
    <g stroke-opacity="0.5" filter="url(#soft)">
      <line x1="306" y1="684" x2="306" y2="756" stroke="#0ea5e9"/>
      <line x1="442" y1="568" x2="442" y2="756" stroke="#a855f7"/>
      <line x1="578" y1="432" x2="578" y2="756" stroke="#10b981"/>
      <line x1="714" y1="288" x2="714" y2="756" stroke="#f97316"/>
    </g>
    <line x1="306" y1="684" x2="306" y2="756" stroke="#0ea5e9"/>
    <line x1="442" y1="568" x2="442" y2="756" stroke="#a855f7"/>
    <line x1="578" y1="432" x2="578" y2="756" stroke="#10b981"/>
    <line x1="714" y1="288" x2="714" y2="756" stroke="#f97316"/>
  </g>
</svg>
