<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Productivity: a precision reticle. Four arms, one per life category,
       sighted on a single point — the day's one thing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="0.55" stop-color="#050811"/>
      <stop offset="1" stop-color="#010205"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- the four sights -->
  <g stroke-width="52" stroke-linecap="round">
    <g opacity="0.5" filter="url(#soft)">
      <line x1="512" y1="196" x2="512" y2="318" stroke="#0ea5e9"/>
      <line x1="828" y1="512" x2="706" y2="512" stroke="#a855f7"/>
      <line x1="512" y1="828" x2="512" y2="706" stroke="#10b981"/>
      <line x1="196" y1="512" x2="318" y2="512" stroke="#f97316"/>
    </g>
    <line x1="512" y1="196" x2="512" y2="318" stroke="#0ea5e9"/>
    <line x1="828" y1="512" x2="706" y2="512" stroke="#a855f7"/>
    <line x1="512" y1="828" x2="512" y2="706" stroke="#10b981"/>
    <line x1="196" y1="512" x2="318" y2="512" stroke="#f97316"/>
  </g>

  <!-- the sight ring and the point itself -->
  <circle cx="512" cy="512" r="168" fill="none" stroke="#f8fafc" stroke-opacity="0.92" stroke-width="42"/>
  <circle cx="512" cy="512" r="58" fill="#f8fafc"/>
</svg>
